name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      #----------------------------------------------
      # install dependencies (make tests = uv sync --extra tests --extra notebooks)
      # includes DataQuery tests (test_aodn_data_queries.py needs notebooks extra)
      #----------------------------------------------
      - name: Install project with tests
        run: make tests

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------

      - name: Run tests
        uses: nick-fields/retry@v4
        # sometimes when having seg faults in the test suite, the runner will just fail without retrying. This ensures we get a chance to retry if that happens.
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            uv run pytest

      #----------------------------------------------
      #        bump version in pyproject.toml
      #----------------------------------------------
      - name: Bump version
        id: bump
        run: |
          python - <<'PYEOF'
          import re, sys
          bump = "${{ github.event.inputs.bump_type }}"
          path = "pyproject.toml"
          content = open(path).read()
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content, re.MULTILINE)
          if not match:
              sys.exit("Could not find version in pyproject.toml")
          major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))
          if bump == "major":
              major += 1; minor = 0; patch = 0
          elif bump == "minor":
              minor += 1; patch = 0
          else:
              patch += 1
          new_version = f"{major}.{minor}.{patch}"
          new_content = re.sub(
              r'^(version\s*=\s*)"[\d.]+"',
              f'\\1"{new_version}"',
              content,
              flags=re.MULTILINE,
          )
          open(path, "w").write(new_content)
          print(f"Bumped to {new_version}")
          PYEOF
          NEW_VERSION=$(python -c "
          import re
          content = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*\"([\d.]+)\"', content, re.MULTILINE)
          print(m.group(1))
          ")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # uv.lock records the project version, keep it in sync with the bump
          uv lock

      #----------------------------------------------
      #        build wheel + sdist
      #----------------------------------------------
      - name: Build wheel and sdist
        run: |
          uv build

          # Keep the ".unfrozen.whl" name: downstream consumers install that asset
          mkdir -p dist-artifacts
          for f in dist/*.whl; do
            cp "$f" "dist-artifacts/$(basename "${f%.whl}").unfrozen.whl"
          done
          cp dist/*.whl dist/*.tar.gz dist-artifacts/

      #----------------------------------------------
      #        commit bump + tag + release
      #----------------------------------------------
      - name: Commit version bump and create tag
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release and upload artifacts
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --generate-notes \
            dist-artifacts/*.whl \
            dist-artifacts/*.tar.gz
