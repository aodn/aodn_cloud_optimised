name: package build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - "3.11.9"
          - "3.12.4"

    defaults:
      run:
        shell: bash -e {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install Project
        # Includes DataQuery tests (test_aodn_data_queries.py needs notebooks extra)
        run: make tests
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        uses: nick-fields/retry@v4
        # sometimes when having seg faults in the test suite, the runner will just fail without retrying. This ensures we get a chance to retry if that happens.
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: bash
          command: |
            set -euo pipefail
            uv pip install pytest-xdist
            uv run coverage run -m pytest
            uv run coverage report --fail-under=60
            uv run coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }} # This skips the step only when running via 'act'
        with:
          name: coverage-report-${{ github.job }}-${{ github.run_number }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: Build wheel and sdist
        run: |
          uv build

          # Keep the ".unfrozen.whl" name: downstream consumers install that asset
          mkdir -p dist-artifacts
          for f in dist/*.whl; do
            cp "$f" "dist-artifacts/$(basename "${f%.whl}").unfrozen.whl"
          done
          cp dist/*.whl dist/*.tar.gz dist-artifacts/

      - name: Verify make (Core Mode)
        run: |
          make core
          uv run python -c "import aodn_cloud_optimised; print('Core OK')"

      - name: Verify make (Notebooks Mode)
        run: |
          make notebooks
          uv run python -c "from aodn_cloud_optimised.lib.DataQuery import GetAodn; print('Notebooks OK')"

      - name: Verify make (Dev Mode)
        run: |
          make dev
          uv run python -c "from aodn_cloud_optimised.lib.DataQuery import GetAodn; print('Dev OK')"

      #----------------------------------------------
      #        verify the wheel (Clean Venv)
      #----------------------------------------------
      - name: Verify Wheel
        run: |
          python -m venv test_env_unfrozen
          source test_env_unfrozen/bin/activate

          # This proves the Unfrozen wheel is self-contained.
          # It should find the xarray git URL in the metadata and install it automatically.
          # We use a wildcard because the version in pyproject.toml is our current truth.
          pip install dist-artifacts/*.unfrozen.whl

          python -c "import aodn_cloud_optimised; print('Unfrozen wheel (URL-based) OK')"
          deactivate
          rm -rf test_env_unfrozen
