default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        files: \.ya?ml$
      - id: check-json
        files: \.json$
        exclude: ^aodn_cloud_optimised/config/dataset/dataset_template.json$
      - id: end-of-file-fixer
        exclude: '\.schema$'
      - id: trailing-whitespace
      - id: check-toml
      - id: pretty-format-json
        files: \.json$
        args: ["--autofix", "--no-sort-keys"]
        exclude: ^aodn_cloud_optimised/config/dataset/dataset_template.json$
      - id: debug-statements
      - id: check-executables-have-shebangs

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["--select", "T201"]
        files: ^aodn_cloud_optimised/lib/(?!DataQuery\.py)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.0
    hooks:
      - id: check-jsonschema
        files: ^aodn_cloud_optimised/config/dataset/.*\.json$
        exclude: ^aodn_cloud_optimised/config/dataset/dataset_template.json$
        args:
          [
            "--schemafile",
            "aodn_cloud_optimised/config/schema_validation_common.json",
          ]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        #exclude: ^aodn_cloud_optimised/bin/create_aws_registry_dataset.py$  # issue with black!

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: validate-json-configs
        name: Validate dataset JSON configs with Pydantic
        entry: uv run python aodn_cloud_optimised/bin/pydantic_precommit_hook.py --validate-configs aodn_cloud_optimised/config/dataset
        language: system
        types: [json]
        pass_filenames: false
        always_run: true
      - id: check-data-query-protected-vars
        name: Validate DataQuery.py
        entry: uv run python aodn_cloud_optimised/bin/validate_data_query.py
        language: system
        pass_filenames: false
        always_run: true
