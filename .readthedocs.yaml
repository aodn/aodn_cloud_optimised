version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - libudunits2-dev

  jobs:
    post_create_environment:
      - python -m pip install uv
    post_install:
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --extra docs

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
