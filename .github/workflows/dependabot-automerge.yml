name: dependabot-automerge

# Enables GitHub auto-merge on Dependabot PRs for patch bumps and grouped
# security updates (the "security" group in dependabot.yml) once all required
# status checks on main pass. Minor/major version bumps are left for manual
# review and merge.
#
# pull_request_target (not pull_request): a Dependabot-authored pull_request
# event forces a read-only, secret-less GITHUB_TOKEN, which can't enable
# auto-merge. pull_request_target runs in the base-repo context and keeps
# write access.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/security updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.dependency-group == 'security'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
