name: dependabot-requirements

# Dependabot only updates uv.lock; re-export the requirements files from it.
#
# Uses pull_request_target (not pull_request): workflow runs triggered directly
# by a Dependabot-authored pull_request event get a forced read-only, secret-less
# GITHUB_TOKEN, so a git push back onto the PR branch would 403 regardless of the
# `permissions` block below. pull_request_target runs in the base-repo context
# instead, which keeps write access; we still explicitly check out the PR's head
# commit to get the updated uv.lock.
on:
  pull_request_target:
    paths: ["uv.lock"]

permissions:
  contents: write

jobs:
  export:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          uv export --no-dev --no-hashes --no-emit-project --extra notebooks -o notebooks/requirements.txt
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: re-export requirements from uv.lock"
            git push
          fi
