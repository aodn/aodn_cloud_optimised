name: Pre-commit

on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project - needed for local uv run hooks
        # Includes DataQuery tests (test_aodn_data_queries.py needs notebooks extra)
        run: make dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files # uncomment this if needed to debug ||true
